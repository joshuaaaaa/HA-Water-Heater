# Příklady konfigurace pro HA Boiler Card

# ================================================
# Příklad 1: Základní konfigurace se 3 senzory
# ================================================
type: custom:ha-boiler-card
title: Bojler
sensors:
  - entity: sensor.boiler_temp_top
    name: Horní
    position: 1
  - entity: sensor.boiler_temp_middle
    name: Střední
    position: 3
  - entity: sensor.boiler_temp_bottom
    name: Spodní
    position: 5

---

# ================================================
# Příklad 2: Kompletní konfigurace s 5 senzory
# ================================================
type: custom:ha-boiler-card
title: Bojler v koupelně
show_average: true
show_gradient: true
min_temp: 0
max_temp: 80
heating_entity: binary_sensor.boiler_heating
target_temp_entity: number.boiler_target_temp
sensors:
  - entity: sensor.boiler_temp_1
    name: Senzor 1 (Vrchol)
    position: 1
  - entity: sensor.boiler_temp_2
    name: Senzor 2
    position: 2
  - entity: sensor.boiler_temp_3
    name: Senzor 3 (Střed)
    position: 3
  - entity: sensor.boiler_temp_4
    name: Senzor 4
    position: 4
  - entity: sensor.boiler_temp_5
    name: Senzor 5 (Dno)
    position: 5

---

# ================================================
# Příklad 3: Solární bojler
# ================================================
type: custom:ha-boiler-card
title: Solární ohřev vody
show_average: true
show_gradient: true
min_temp: 15
max_temp: 95
heating_entity: binary_sensor.solar_collector_active
target_temp_entity: input_number.solar_target_temperature
sensors:
  - entity: sensor.solar_tank_sensor_1
    name: Horní zóna (odběr)
    position: 1
  - entity: sensor.solar_tank_sensor_2
    name: Střední horní
    position: 2
  - entity: sensor.solar_tank_sensor_3
    name: Střední
    position: 3
  - entity: sensor.solar_tank_sensor_4
    name: Střední spodní
    position: 4
  - entity: sensor.solar_tank_sensor_5
    name: Dolní zóna (přívod)
    position: 5

---

# ================================================
# Příklad 4: Elektrický ohřívač bez průměru
# ================================================
type: custom:ha-boiler-card
title: Elektrický ohřívač
show_average: false
show_gradient: true
min_temp: 10
max_temp: 75
heating_entity: switch.water_heater
sensors:
  - entity: sensor.electric_heater_top_temp
    name: Horní termostat
    position: 1
  - entity: sensor.electric_heater_bottom_temp
    name: Spodní termostat
    position: 5

---

# ================================================
# Příklad 5: Tepelné čerpadlo s bojlerem
# ================================================
type: custom:ha-boiler-card
title: Zásobník TČ
show_average: true
show_gradient: true
min_temp: 5
max_temp: 65
heating_entity: binary_sensor.heat_pump_dhw_active
target_temp_entity: climate.heat_pump_water_heater
sensors:
  - entity: sensor.hp_tank_top
    name: Výstup TUV
    position: 1
  - entity: sensor.hp_tank_upper_middle
    name: Horní střed
    position: 2
  - entity: sensor.hp_tank_middle
    name: Střed zásobníku
    position: 3
  - entity: sensor.hp_tank_lower_middle
    name: Dolní střed
    position: 4
  - entity: sensor.hp_tank_bottom
    name: Vstup z TČ
    position: 5
