# ================================================
# Příklad 11: Hybridní systém - solární + elektrické dohřívání
# ================================================
type: custom:ha-boiler-card
title: Hybridní ohřev
display_mode: normal
show_average: true
show_gradient: true
show_stratification: true
min_temp: 0
max_temp: 95
target_temp_entity: input_number.boiler_target_temp
# NOVÉ v1.2.0: Podpora více zdrojů ohřevu
heating_sources:
  - entity: binary_sensor.solar_collector_active
    type: solar
    name: Solární kolektor
    priority: 1  # Priorita 1 = primární zdroj
  - entity: binary_sensor.electric_heater_active
    type: electric
    name: Elektrické dohřívání
    priority: 2  # Priorita 2 = sekundární zdroj
# Údržba
anode_last_change: '2024-01-15'
cleaning_last_date: '2024-06-01'
sensors:
  - entity: sensor.hybrid_tank_top
    name: Horní výstup
    position: 1
  - entity: sensor.hybrid_tank_solar
    name: Solární zóna
    position: 3
  - entity: sensor.hybrid_tank_electric
    name: Elektrická spirála
    position: 4
  - entity: sensor.hybrid_tank_bottom
    name: Vstup studené
    position: 5

