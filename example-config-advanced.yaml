    - low_temperature      # Nízká teplota
    - legionella_risk      # Riziko legionely
    - high_consumption     # Vysoká spotřeba
# Upozornění pro aktivaci notifikací
alerts:
  - type: legionella_risk
    min_temp: 60
    duration: 168
    enabled: true
# Údržba pro aktivaci notifikací
anode_last_change: '2024-01-01'
anode_change_interval: 365
sensors:
  - entity: sensor.boiler_temp_top
    position: 1
  - entity: sensor.boiler_temp_bottom
    position: 5

