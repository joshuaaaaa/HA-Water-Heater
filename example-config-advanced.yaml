# ================================================
# Příklad 16: Pokročilá upozornění
# ================================================
type: custom:ha-boiler-card
title: Bojler s upozorněními
display_mode: normal
show_average: true
show_gradient: true
# NOVÉ v1.3.0: Pokročilá upozornění
alerts:
  - type: temperature_drop
    threshold: 15  # Upozornění při poklesu o 15°C za hodinu
    enabled: true
    message: 'Výrazný pokles teploty - možná porucha!'
  - type: legionella_risk
    min_temp: 60  # Minimální teplota pro prevenci legionely
    duration: 168  # 7 dní v hodinách (7*24)
    enabled: true
    message: 'Riziko legionely - ohřejte bojler na 60°C!'
  - type: unusual_consumption
    threshold: 3000  # Watty
    enabled: true
    message: 'Neobvykle vysoká spotřeba energie!'
sensors:
  - entity: sensor.boiler_temp_top
    position: 1
  - entity: sensor.boiler_temp_middle
    position: 3
  - entity: sensor.boiler_temp_bottom
    position: 5

---

