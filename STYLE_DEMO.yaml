# ================================================
# STYLY TLAČÍTKA (button_style)
# ================================================

# 1. DEFAULT (Výchozí) - Barevné tlačítko s gradientem
type: custom:ha-boiler-card
title: "1. Default Button"
show_control_button: true
control_entity: switch.boiler_power
button_style: default  # nebo vypustit (je výchozí)
layout_style: default
sensors:
  - entity: sensor.boiler_temp_top
    name: Vrchol
    position: 1
  - entity: sensor.boiler_temp_middle
    name: Střed
    position: 3
  - entity: sensor.boiler_temp_bottom
    name: Dno
    position: 5

---

