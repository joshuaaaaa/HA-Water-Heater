# ================================================
# JAK VYZKOUŠET:
# ================================================
#
# 1. Zkopíruj konfiguraci výše (mezi --- značkami)
# 2. Vlož ji do svého Home Assistant dashboard (edit mode)
# 3. Uprav entity podle tvých skutečných senzorů
# 4. Uložit
# 5. Podívej se, jak to vypadá
# 6. Opakuj s jinými styly
# 7. Až najdeš oblíbený, napiš mi číslo (1-16) a nahraju to na GitHub!
#
# TIPY:
# - button_style: default | switch | icon | minimal
# - layout_style: default | horizontal | minimal | wide
# - Kombinuj je jak chceš!
# - Přidej theme: ocean | sunset | forest | fire | ice
#
# ================================================
